name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: starter
          # The container lives only for this job and listens on the runner, so trust auth is
          # safe here and keeps any password out of the repository.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: starter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://starter@localhost:5432/starter_test
      APP_TEST_DATABASE_URL: postgresql+asyncpg://starter@localhost:5432/starter_test
      APP_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --python "$PYTHON_VERSION"
      - name: Format and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Type-check
        run: uv run mypy app tests migrations
      - name: Migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: starter
          # The container lives only for this job and listens on the runner, so trust auth is
          # safe here and keeps any password out of the repository.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENVIRONMENT: test
      APP_DATABASE_URL: postgresql+asyncpg://starter@localhost:5432/starter
      APP_REDIS_URL: redis://localhost:6379/0
      APP_LOG_FORMAT: json
      API_URL: http://localhost:8000
      E2E_ADMIN_EMAIL: e2e-admin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API
        working-directory: backend
        run: |
          uv sync --locked --no-dev --python "$PYTHON_VERSION"
          uv run alembic upgrade head
          # A throwaway admin password for this run only, never stored.
          E2E_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$E2E_ADMIN_PASSWORD"
          echo "E2E_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          printf '%s\n' "$E2E_ADMIN_PASSWORD" | uv run python -m app.cli create-user \
            --email "$E2E_ADMIN_EMAIL" --name "E2E Admin" --role admin --password-stdin
          nohup uv run uvicorn app.main:create_app --factory --port 8000 --no-access-log > ../api.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/health/ready && break; sleep 1; done
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: End-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            api.log
          retention-days: 7

  images:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          tags: starter-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
