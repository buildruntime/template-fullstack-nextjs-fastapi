[project]
name = "buildruntime-starter-api"
version = "0.1.0"
description = "FastAPI backend of the Buildruntime full-stack starter template"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.162,<0.163",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "email-validator>=2.3,<3",
    "sqlalchemy[asyncio]>=2.1.8,<2.2",
    "asyncpg>=0.32,<0.33",
    "alembic>=1.20,<2",
    "argon2-cffi>=25.1,<26",
    "redis>=8.1,<9",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "httpx>=0.28,<0.29",
    "mypy>=2.4,<3",
    "ruff>=0.17,<0.18",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = ["integration: needs PostgreSQL and Redis"]
